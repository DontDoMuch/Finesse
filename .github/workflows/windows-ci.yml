# M195: two distinct claims. The vendor-free offline compatibility core can pass
# while the full public installer source gate remains explicitly incomplete.
name: M195 offline compatibility checks (NOT the full installer)

on:
  workflow_dispatch:
  push:
    branches: [m195-public-build-ci-foundation]
    paths:
      - 'build.ps1'
      - 'global.json'
      - 'Source/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    paths:
      - 'build.ps1'
      - 'global.json'
      - 'Source/**'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: read

jobs:
  compatibility-offline:
    name: Offline compatibility core (NOT installer validation)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout repository (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up .NET 10 SDK on Windows runner (pinned)
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: global.json
      - name: Run vendor-independent profile and DAT payload tests
        shell: powershell
        run: |
          dotnet --version
          if ($LASTEXITCODE -ne 0) { throw "System dotnet unavailable" }
          dotnet run --project "Source/test/Finesse.Compatibility.OfflineTests/Finesse.Compatibility.OfflineTests.csproj" --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Offline compatibility tests failed" }
          dotnet build "Source/tools/Finesse.DatVerifier/Finesse.DatVerifier.csproj" --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Offline DAT verifier tool failed to compile" }
          dotnet build "Source/tools/Finesse.CandidateVerifier/Finesse.CandidateVerifier.csproj" --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Combined offline INF+DAT candidate verifier failed to compile" }

  public-installer-source-gate:
    # This MUST NOT make every offline-source commit look like a failed CI
    # release build. Run explicitly for a full-installer source readiness audit.
    # When the source is absent it deliberately fails, never returns false green.
    if: github.event_name == 'workflow_dispatch'
    name: Full installer source gate (manual; expected BLOCKED until complete)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout repository (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up .NET 10 SDK on Windows runner (pinned)
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          global-json-file: global.json
      - name: Run the same system-dotnet build/check script as developers
        shell: powershell
        run: .\build.ps1 -Configuration Release -Ci

# No publish, release, signing or attestation until full public source gates pass.
